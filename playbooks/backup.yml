---
- name: Configure Linux configuration backup
  hosts: linux
  become: true
  tasks:
    - name: Create local backup directory
      ansible.builtin.file:
        path: "{{ backup_destination }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Install configuration backup script
      ansible.builtin.template:
        src: "{{ playbook_dir | dirname }}/templates/backup-config.sh.j2"
        dest: /usr/local/sbin/backup-config
        owner: root
        group: root
        mode: "0750"

    - name: Schedule nightly configuration backup
      ansible.builtin.cron:
        name: Nightly configuration backup
        user: root
        minute: "30"
        hour: "2"
        job: /usr/local/sbin/backup-config
