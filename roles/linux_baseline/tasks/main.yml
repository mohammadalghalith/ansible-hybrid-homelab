---
- name: Install administration packages
  ansible.builtin.apt:
    name: "{{ linux_packages }}"
    state: present
    update_cache: true

- name: Create support administrators group
  ansible.builtin.group:
    name: "{{ linux_admin_group }}"
    state: present

- name: Create support account
  ansible.builtin.user:
    name: "{{ support_account }}"
    groups: "{{ linux_admin_group }}"
    append: true
    shell: /bin/bash
    create_home: true

- name: Grant support administrators sudo access
  ansible.builtin.copy:
    content: "%{{ linux_admin_group }} ALL=(ALL) ALL\n"
    dest: "/etc/sudoers.d/{{ linux_admin_group }}"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Allow required TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ linux_allowed_tcp_ports }}"
  notify: Reload firewall

- name: Enable host firewall
  community.general.ufw:
    state: enabled
    policy: deny

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
